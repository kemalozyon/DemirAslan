<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Demir Aslan - Kuyumcu Fiyat Panosu</title>
  <style>
    :root {
      --bg-color: #000000;
      --text-color: #ffffff;
      --header-color: #ffd700;
      --price-bg: rgba(255, 255, 255, 0.1);
      --price-color: #ffd700;
      --market-bg: rgba(0, 0, 0, 0.8);
      --shadow-color: rgba(255, 215, 0, 0.3);
      --border-color: rgba(255, 215, 0, 0.5);
      --glow-color: rgba(255, 215, 0, 0.8);
      --box-color: #333333;
    }

    [data-theme="light"] {
      --bg-color: #ffffff;
      --text-color: #000000;
      --header-color: #d4af37;
      --price-bg: rgba(255, 255, 255, 0.85);
      --price-color: #000000;
      --market-bg: rgba(255, 255, 255, 0.95);
      --shadow-color: rgba(255, 215, 0, 0.7);
      --border-color: rgba(212, 175, 55, 0.7);
      --glow-color: rgba(255, 215, 0, 1);
      --box-color: #f5f5f5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
      background-image: radial-gradient(circle at center, rgba(255, 215, 0, 0.05) 0%, rgba(0, 0, 0, 0) 70%);
    }

    [data-theme="light"] body {
      background-image: radial-gradient(circle at center, rgba(255, 215, 0, 0.3) 0%, rgba(255, 255, 255, 0) 75%);
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 1vh 2vw;
      padding-bottom: 3rem;
      gap: 0.8vh;
    }

    .title-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .logo {
      width: min(15vw, 100px);
      height: auto;
      margin-bottom: min(1.5vh, 0.8rem);
      filter: drop-shadow(0 0 15px var(--glow-color));
    }

    /* Diamond shape with glow effect */
    .diamond-logo {
      width: min(15vw, 80px);
      height: min(15vw, 80px);
      margin: 0 auto;
      margin-bottom: min(2.5vh, 1.5rem);
      position: relative;
      animation: logoPulse 3s infinite ease-in-out;
    }

    .diamond-logo svg {
      width: 100%;
      height: 100%;
      fill: var(--header-color);
    }

    [data-theme="light"] .diamond-logo {
      filter: drop-shadow(0 0 25px rgba(241, 205, 69, 0.8));
    }

    @keyframes logoPulse {
      0% {
        filter: drop-shadow(0 0 3px var(--header-color)) drop-shadow(0 0 8px var(--header-color));
        transform: scale(0.92);
        opacity: 0.7;
      }
      50% {
        filter: drop-shadow(0 0 15px var(--header-color)) drop-shadow(0 0 25px var(--header-color));
        transform: scale(1.08);
        opacity: 1;
      }
      100% {
        filter: drop-shadow(0 0 3px var(--header-color)) drop-shadow(0 0 8px var(--header-color));
        transform: scale(0.92);
        opacity: 0.7;
      }
    }

    .header {
      font-size: min(3.8vw, 2.8rem);
      text-align: center;
      color: var(--header-color);
      margin-bottom: min(1.5vh, 1rem);
      font-weight: 700;
      letter-spacing: 1px;
      position: relative;
      padding-bottom: min(0.8vh, 0.4rem);
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(20vw, 150px);
      height: 3px;
      background: var(--header-color);
      border-radius: 2px;
      box-shadow: 0 0 25px 4px var(--glow-color);
    }

    .subheader {
      font-size: 1.25rem;
      text-align: center;
      color: var(--text-color);
      margin-bottom: 2rem;
      font-weight: 400;
      opacity: 0.8;
      letter-spacing: -0.5px;
    }

    .price-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin: 0 auto;
      max-width: 95vw;
      table-layout: fixed;
    }

    .price-table tr {
      display: grid;
      grid-template-columns: 28% 35% 35%;
      gap: 1%;
      margin-bottom: min(1vh, 0.5rem);
    }

    .price-row {
      transition: all 0.3s ease;
      height: min(10vh, 4.2rem);
    }

    .price-row:hover {
      transform: scale(1.02);
    }

    .product-name {
      font-size: min(2.5vw, 1.6rem);
      color: var(--text-color);
      text-align: center;
      width: 100%;
      font-weight: 600;
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      background: var(--box-color);
      border-radius: min(1.5vw, 12px);
      padding: min(1vh, 0.8rem);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 24px var(--shadow-color), 0 0 15px var(--glow-color);
      border: 1px solid var(--border-color);
      min-width: unset;
      animation: goldPulse 3s infinite ease-in-out;
    }

    .product-emoji {
      font-size: min(2vw, 1.4rem);
      color: var(--header-color);
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.9);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-label {
      text-align: center;
      white-space: nowrap;
      overflow: visible;
      font-size: min(2.4vw, 1.4rem);
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    [data-theme="light"] .product-emoji {
      color: #d4af37;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.9);
    }

    .price-row:hover .product-name {
      box-shadow: 0 8px 32px var(--shadow-color), 0 0 25px var(--glow-color);
      border-color: var(--header-color);
      transform: translateY(-2px);
      border-width: 2px;
    }

    [data-theme="light"] .price-row:hover .product-name {
      background: rgba(255, 255, 255, 0.95);
      border-color: #d4af37;
      color: #000000;
      box-shadow: 0 8px 32px rgba(255, 215, 0, 0.9), 0 0 35px rgba(255, 215, 0, 1);
      border-width: 2px;
    }

    .price-cell {
      background: var(--box-color);
      font-size: min(3.5vw, 2.2rem);
      font-weight: 600;
      text-align: center;
      padding: min(1.5vh, 1rem) min(1.2vh, 0.8rem);
      border-radius: min(1.5vw, 12px);
      width: 100%;
      color: var(--text-color);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 24px var(--shadow-color), 0 0 15px var(--glow-color);
      border: 1px solid var(--border-color);
      letter-spacing: -0.5px;
      transition: all 0.3s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .price-row:hover .price-cell {
      box-shadow: 0 8px 32px var(--shadow-color), 0 0 25px var(--glow-color);
      border-color: var(--header-color);
      background: rgba(255, 248, 225, 0.95);
      transform: translateY(-2px);
      border-width: 2px;
    }

    [data-theme="light"] .price-row:hover .price-cell {
      background: rgba(255, 255, 255, 0.95);
      color: #000000;
      border-color: #d4af37;
      box-shadow: 0 8px 32px rgba(255, 215, 0, 0.9), 0 0 35px rgba(255, 215, 0, 1);
      border-width: 2px;
    }

    [data-theme="light"] .price-cell {
      text-shadow: none;
      color: #000000;
    }

    /* Ensure text is white in dark mode */
    :root .price-cell {
      color: var(--text-color);
    }

    :root .product-name {
      color: var(--text-color);
    }
    
    :root .product-label {
      color: var(--text-color);
    }

    :root .header-row .product-name {
      color: var(--text-color);
    }
    
    /* Common text elements should use text color variable */
    :root .time,
    :root .date,
    :root #current-time,
    :root .last-updated,
    :root .author {
      color: var(--text-color);
    }

    /* Override product emoji color to always be gold */
    :root .product-emoji {
      color: var(--header-color);
    }

    /* Update label styles for light/dark mode */
    :root .product-name .product-label {
      color: var(--text-color);
    }

    /* Additional spacing for last items */
    .price-row:nth-last-child(-n+2) {
      margin-bottom: min(2vh, 0.9rem);
    }

    .header-row {
      margin-bottom: 15px;
    }

    .header-row .product-name {
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-color);
      background: var(--box-color);
      box-shadow: 0 4px 24px var(--shadow-color), 0 0 15px var(--glow-color);
      text-align: center;
      justify-content: center;
    }

    /* Styles for when the header is hidden */
    .header.hidden {
      display: none;
    }

    .title-container.hidden {
      display: none;
    }

    .header-hidden .container {
      padding-top: min(4vh, 2rem);
    }

    .header-hidden .price-table {
      margin-top: min(2vh, 1rem);
    }

    /* Ensure header cells have proper text color */
    .header-cell {
      color: var(--text-color);
    }
    
    /* Center market info at the bottom */
    .market-info {
      position: fixed;
      bottom: 5px;
      left: 0;
      right: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 3px;
    }
    
    .time, .last-updated, .author {
      text-align: center;
      width: 100%;
      font-size: min(2vw, 1rem);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title-container">
      <div class="diamond-logo">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <path id="Diamond" d="M63.6870499,18.5730648L48.7831497,4.278266c-0.1855011-0.1758003-0.4316025-0.4813001-0.6870003-0.4813001

        </svg>
      </div>
      <h1 class="header">DEMİRASLAN</h1>
    </div>
    
    <table class="price-table">
      <tr class="header-row">
        <td class="product-name">
          <span class="product-label">ÜRÜNLER</span>
        </td>
        <td class="product-name">
          <span class="product-label">ALIŞLAR</span>
        </td>
        <td class="product-name">
          <span class="product-label">SATIŞLAR</span>
        </td>
      </tr>
    </table>

    <div id="price-grid" class="price-table"></div>
  </div>

  <div class="market-info">
    <div class="time">
      <span id="current-date" class="date"></span>
      <span id="current-time"></span>
    </div>
    <div id="lastUpdated" class="last-updated"></div>
    <div class="author">by Kemal Özyön</div>
  </div>

  <script>
    // Request current colors/settings when the page loads
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize time and date
      updateDateTime();
      
      // Initialize last updated
      updateLastUpdated();
      
      // Request current display settings from main process
      window.electron.send('get-display-colors');
    });
    
    window.electron.receive('theme-changed', (theme) => {
      document.documentElement.setAttribute('data-theme', theme);
      
      // Make sure all text elements use the correct text color when theme changes
      setTimeout(() => {
        const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text-color').trim();
        const textElements = document.querySelectorAll('.product-label, .price-cell, .header-cell, .time, .date, #current-time, .last-updated, .author');
        textElements.forEach(element => {
          element.style.color = textColor;
        });
      }, 100);
    });

    // Receive initial colors on page load
    window.electron.receive('current-display-colors', (colors) => {
      // Apply all color settings
      const root = document.documentElement;
      
      if (colors.bgColor) {
        root.style.setProperty('--bg-color', colors.bgColor);
      }
      
      if (colors.titleColor) {
        root.style.setProperty('--header-color', colors.titleColor);
        // Diamond color is fixed now - no need to update
      }
      
      if (colors.textColor) {
        root.style.setProperty('--text-color', colors.textColor);
      }
      
      if (colors.boxColor) {
        root.style.setProperty('--box-color', colors.boxColor);
      }
      
      if (colors.shadowColor) {
        const hexToRgba = (hex, alpha = 1) => {
          const r = parseInt(hex.slice(1, 3), 16);
          const g = parseInt(hex.slice(3, 5), 16);
          const b = parseInt(hex.slice(5, 7), 16);
          return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        };
        
        root.style.setProperty('--shadow-color', hexToRgba(colors.shadowColor, 0.3));
        root.style.setProperty('--border-color', hexToRgba(colors.shadowColor, 0.5));
        root.style.setProperty('--glow-color', hexToRgba(colors.shadowColor, 0.8));
      }
      
      // Apply title visibility setting
      if (colors.hasOwnProperty('showTitle')) {
        const titleContainer = document.querySelector('.title-container');
        if (!colors.showTitle) {
          titleContainer.classList.add('hidden');
          document.body.classList.add('header-hidden');
        } else {
          titleContainer.classList.remove('hidden');
          document.body.classList.remove('header-hidden');
        }
      }
    });

    function updateDateTime() {
      const now = new Date();
      const dateOptions = { year: 'numeric', month: 'long', day: 'numeric' };
      const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
      
      document.getElementById('current-date').textContent = now.toLocaleDateString('tr-TR', dateOptions);
      document.getElementById('current-time').textContent = now.toLocaleTimeString('tr-TR', timeOptions);
    }

    // Update date and time every second
    setInterval(updateDateTime, 1000);
    updateDateTime(); // Initial update

    function updateDisplay(prices) {
      const priceGrid = document.getElementById('price-grid');
      priceGrid.innerHTML = '';

      const table = document.createElement('table');
      table.className = 'price-table';

      const products = [
        { key: '22 Ayar', label: '22 AYAR', emoji: '🪙' },
        { key: 'Çeyrek', label: 'YENİ ÇEYREK', emoji: '🪙' },
        { key: 'B.Çeyrek', label: 'ESKİ ÇEYREK', emoji: '🪙' },
        { key: 'Yarım', label: 'YENİ YARIM', emoji: '🪙' },
        { key: 'Tam', label: 'ESKİ YARIM', emoji: '🪙' },
        { key: '24 Ayar', label: 'YENİ TEK ATA', emoji: '🪙' },
        { key: 'ESKI TEK ATA', label: 'ESKİ TEK ATA', emoji: '🪙' },
        { key: 'YENI KREMSIYE', label: 'YENİ KREMSİYE', emoji: '🪙' },
        { key: 'ESKI KREMSIYE', label: 'ESKİ KREMSİYE', emoji: '🪙' }
      ];

      products.forEach(product => {
        const price = prices.find(p => p.name === product.key) || { buyPrice: 0, sellPrice: 0 };
        const row = document.createElement('tr');
        row.className = 'price-row';
        row.innerHTML = `
          <td class="product-name">
            <span class="product-emoji">${product.emoji}</span>
            <span class="product-label">${product.label}</span>
          </td>
          <td class="price-cell">${Math.floor(price.buyPrice).toLocaleString('tr-TR')}</td>
          <td class="price-cell">${Math.floor(price.sellPrice).toLocaleString('tr-TR')}</td>
        `;
        table.appendChild(row);
      });

      priceGrid.appendChild(table);
      
      // Apply text colors to all elements
      const textElements = document.querySelectorAll('.product-label, .price-cell, .header-cell, .time, .date, #current-time, .last-updated, .author');
      textElements.forEach(element => {
        element.style.color = 'var(--text-color)';
      });
    }

    // Listen for price updates
    window.electron.receive('display-updated', (prices) => {
      console.log('Received prices in display:', prices);
      updateDisplay(prices);
      
      // Update last updated time
      updateLastUpdated();
      
      // Flash animation for updated prices
      const priceElements = document.querySelectorAll('.price-cell');
      priceElements.forEach(el => {
        el.classList.remove('flash');
        void el.offsetWidth; // Force reflow
        el.classList.add('flash');
      });
    });

    // Function to update the last updated time
    function updateLastUpdated() {
      const now = new Date();
      const formattedDate = now.toLocaleDateString('tr-TR', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      });
      const formattedTime = now.toLocaleTimeString('tr-TR', {
        hour: '2-digit',
        minute: '2-digit'
      });

      document.getElementById('lastUpdated').textContent = `Son Güncelleme: ${formattedDate} ${formattedTime}`;
    }

    // Handle custom color updates
    window.electron.receive('update-display-colors', (colors) => {
      const root = document.documentElement;
      
      // Update CSS variables with the custom colors
      if (colors.bgColor) {
        root.style.setProperty('--bg-color', colors.bgColor);
      }
      
      if (colors.titleColor) {
        root.style.setProperty('--header-color', colors.titleColor);
        // Diamond color is fixed now - no need to update
      }
      
      if (colors.textColor) {
        root.style.setProperty('--text-color', colors.textColor);
        
        // Apply text color to all text elements
        const textElements = document.querySelectorAll('.product-label, .price-cell, .header-cell, .time, .date, #current-time, .last-updated, .author');
        textElements.forEach(element => {
          element.style.color = colors.textColor;
        });
      }
      
      if (colors.boxColor) {
        root.style.setProperty('--box-color', colors.boxColor);
      }
      
      if (colors.shadowColor) {
        // Convert hex to rgba for shadow with opacity
        const hexToRgba = (hex, alpha = 1) => {
          const r = parseInt(hex.slice(1, 3), 16);
          const g = parseInt(hex.slice(3, 5), 16);
          const b = parseInt(hex.slice(5, 7), 16);
          return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        };
        
        root.style.setProperty('--shadow-color', hexToRgba(colors.shadowColor, 0.3));
        root.style.setProperty('--border-color', hexToRgba(colors.shadowColor, 0.5));
        root.style.setProperty('--glow-color', hexToRgba(colors.shadowColor, 0.8));
      }
      
      // Handle title visibility - with a more direct approach
      const titleContainer = document.querySelector('.title-container');
      
      if (colors.hasOwnProperty('showTitle')) {
        if (colors.showTitle) {
          titleContainer.classList.remove('hidden');
          document.body.classList.remove('header-hidden');
        } else {
          titleContainer.classList.add('hidden');
          document.body.classList.add('header-hidden');
        }
      }
    });

    // Update the last updated time on page load
    document.addEventListener('DOMContentLoaded', updateLastUpdated);
  </script>
</body>
</html>
